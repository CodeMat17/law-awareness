[build]
  command    = "yarn build"
  publish    = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Turbopack's build cache stores server env values; it stays on Netlify and is never served.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"
  # Public by design (inlined into the browser bundle), so the secrets scan must skip them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL,NEXT_PUBLIC_CLERK_SIGN_IN_URL,NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL,NEXT_PUBLIC_CLERK_SIGN_UP_URL,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_CONVEX_SITE_URL,NEXT_PUBLIC_CONVEX_URL,CLERK_JWT_ISSUER_DOMAIN,CONVEX_DEPLOYMENT"

[[plugins]]
  package = "@netlify/plugin-nextjs"
